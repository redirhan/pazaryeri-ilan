    guven: ikincil
    not: "Trendyol: 'bize ulaşın' satırları ve dış bağlantı yasak (resmi, arama özeti). Kelime listesi bizim."
  diger_platform_adlari:
    deger: ["trendyol", "hepsiburada", "n11$", "amazon", "çiçeksepeti", "ciceksepeti", "pttavm", "etsy", "shopier", "dolap", "sahibinden", "gittigidiyor", "instagram", "facebook", "tiktok"]
