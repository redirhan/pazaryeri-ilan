        deger: "Ayrı madde alanı yok (API alanlarında bulunmuyor); öne çıkan maddeler açıklamanın başına liste olarak eklenir. Alt başlık bir özelliği öne çıkarmak için kullanılabilir."
        kaynak: https://developer.n11.com/documentation/n11-marketplace-entegrasyonu/urun-yukleme/
