# Pazaryeri İlan Kiti: platform kuralları
#
# Her kural: deger + kaynak (URL ya da "yok: açıklama") + tarih (okunma, YYYY-AA-GG) + guven + isteğe bağlı not / dogrula.
#   guven: resmi   = platformun kendi sayfası, API dokümanı ya da PDF'i
#          ikincil = entegratör, ajans ya da blog sayfası
#          tahmin  = bizim önerimiz ya da bir resmi değerden çıkarım
# guven resmi değilse (ya da dogrula: evet ise) çıktıda "satıcı panelinden doğrula" yazar.
# "dogrula: evet" olan resmi kurallar: resmi sayfa yalnız arama motoru özetinden okunabildi, sayfa eski ya da kaynaklar çelişiyor.
# Kaynaklar çelişirse DAHA SIKI değer kodlandı ve "not" alanına yazıldı.
# Satıcı paneli (giriş gerektiren sayfalar) okunmadı. Yüklemeden önce panelde kontrol edin.

surum: "1.0.0"
kural_tarihi: "2026-10-27"

platformlar:
  trendyol:
    ad: "Trendyol"
    kurallar:
      baslik_max:
        deger: 100
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
        not: "API alan tablosu: title string 100. v3.0 uluslararası doküman da 100 diyor. Resmi bir en az sınırı bulunamadı."
      baslik_kalip:
        deger: [cinsiyet, temel_ozellikler, urun_tipi, renk, miktar]
        kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
        tarih: "2026-10-27"
        guven: ikincil
        not: "Resmi metin (arama özeti): ürün adı ürün üzerindeki şekliyle girilir; ebat, ağırlık, renk, ml/gram eklenebilir; yalnız ürünün kendi markası. Sıra bizim Türkçe kalıbımız (niteleyenler isimden önce)."
      baslik_marka_notu:
        deger: "Trendyol marka alanını ayrı tutar ve ürün sayfasında başlığın önünde gösterir; marka başlığa da yazılırsa çift görünebilir. Bu yüzden Trendyol kalıbında marka yok. Panel önizlemesinde kontrol et; markanın başlıkta olmasını istersen baslik_kalip'e 'marka' ekle."
        kaynak: "yok: ürün sayfası gözlemi, resmi kural bulunamadı"
        tarih: "2026-10-27"
        guven: tahmin
      not_baslik_icerik:
        deger: "Başka marka adı yazma; yalnız ürünün kendi markası. Resmi yasaklı kelime listesi bulunamadı; kampanya/kargo/fiyat ifadeleri ve tamamı büyük harf yine de yazılmamalı (genel uygulama)."
        kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
        tarih: "2026-10-27"
        guven: resmi
        dogrula: evet
      aciklama_max:
        deger: 30000
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
      aciklama_html:
        deger: "evet"
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
        not: "description alan türü HTML-string."
      not_aciklama_icerik:
        deger: "Açıklamada kargo bilgisi, teslimat süresi, 'bize ulaşın' gibi iletişim satırları, video ya da dış bağlantı ve kampanya ifadesi olmaz. Ürünün içeriği, detayları, garanti durumu ve hammaddesi yazılır; gıdada etiket bilgisi."
        kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
        tarih: "2026-10-27"
        guven: resmi
        dogrula: evet
        not: "Sayfa JavaScript ile açılıyor; arama motoru özetinden okundu."
      madde_alani:
        deger: "Trendyol'da ayrı 'madde' alanı yok (API alanlarında bulunmuyor). Öne çıkan maddeler açıklamanın başına liste olarak eklenir."
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
      madde_adet:
        deger: 5
        kaynak: "yok: bizim önerimiz (açıklamadaki liste için)"
        tarih: "2026-10-27"
        guven: tahmin
      arama_alani:
        deger: "Ayrı arama kelimesi alanı yok. Alıcının arayacağı kelimeler başlıkta, açıklamada ve özellik değerlerinde doğal biçimde geçmeli."
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
      not_barkod:
        deger: "Barkod en çok 40 karakter; özel karakter olarak yalnız . - _ kullanılır. Model kodu (productMainId) en çok 40, stok kodu en çok 100 karakter. Aynı model koduna sahip barkodlar varyant olarak gruplanır."
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
        not: "İkincil kaynaklar barkod biçimi için farklı şeyler yazıyor (13-20 alfanümerik vb.)."
      gorsel_adet_max:
        deger: 8
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
        not: "Barkod başına en çok 8 görsel."
      gorsel_min_px:
        deger: "600x800"
        kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
        tarih: "2026-10-27"
        guven: resmi
        dogrula: evet
        not: "Akademi (arama özeti): en az 600x800, 72 dpi. idifo (ikincil) 860x574 diyor; çelişki."
      gorsel_onerilen_px:
        deger: "1200x1800"
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: resmi
        not: "API: 1200x1800, 96 dpi."
      gorsel_oran:
        deger: "2:3"
        kaynak: https://developers.trendyol.com/v2.0/docs/product-create-createproducts
        tarih: "2026-10-27"
        guven: tahmin
        not: "Önerilen 1200x1800 ölçüsünden çıkarıldı (dikey 2:3)."
      gorsel_max_px:
        deger: "2000x2000"
        kaynak: https://idifo.com/blog/trendyol-gorsel-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Resmi kaynakta görülmedi."
      gorsel_dosya_mb_max:
        deger: 10
        kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/146
        tarih: "2026-10-27"
        guven: resmi
        dogrula: evet
      gorsel_dosya_turleri:
        deger: [JPEG, PNG]
        kaynak: https://idifo.com/blog/trendyol-gorsel-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "idifo WebP de diyor; resmi kaynakta doğrulanmadı, WebP bu yüzden listede yok."
      gorsel_zemin:
        deger: beyaz_tercih
        kaynak: https://idifo.com/blog/trendyol-gorsel-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "'Düz beyaz veya açık renkli arka plan tercih edilmelidir' (zorunlu saf beyaz değil). Birfatura da beyaz/nötr fon diyor."
      gorsel_yazi:
        deger: "Görselde filigran, fiyat/kampanya/kargo yazısı, ilgisiz logo, başka e-ticaret sitesi adı ve sağlık beyanı olmaz; görsel ürünün markası, ölçüsü ve rengiyle aynı olmalı; kendi ya da lisanslı fotoğraf"
        kaynak: https://idifo.com/blog/trendyol-gorsel-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Başka site adı, sağlık beyanı ve ürünle uyum Akademi detay/242'de (resmi, arama özeti); filigran ve fiyat yazısı yalnız ikincil kaynakta."
      csv_kolonlar:
        deger:
          - kolon: "Barkod"
            alan: barkod
          - kolon: "Model Kodu"
            alan: model_kodu
          - kolon: "Marka"
            alan: marka
          - kolon: "Kategori"
            alan: kategori
          - kolon: "Para Birimi"
            alan: para_birimi
          - kolon: "Ürün Adı"
            alan: baslik
          - kolon: "Ürün Açıklaması"
            alan: aciklama
          - kolon: "Piyasa Satış Fiyatı (KDV Dahil)"
            alan: liste_fiyati
          - kolon: "Trendyol'da Satılacak Fiyat (KDV Dahil)"
            alan: satis_fiyati
          - kolon: "Ürün Stok Adedi"
            alan: stok
          - kolon: "Stok Kodu"
            alan: stok_kodu
          - kolon: "KDV Oranı"
            alan: kdv
          - kolon: "Desi"
            alan: desi
          - kolon: "Sevkiyat Süresi"
            alan: hazirlik_gunu
          - kolon: "Renk"
            alan: renk
          - kolon: "Beden"
            alan: beden
          - kolon: "Görsel 1"
            alan: gorsel_1
          - kolon: "Görsel 2"
            alan: gorsel_2
          - kolon: "Görsel 3"
            alan: gorsel_3
          - kolon: "Görsel 4"
            alan: gorsel_4
          - kolon: "Görsel 5"
            alan: gorsel_5
          - kolon: "Görsel 6"
            alan: gorsel_6
          - kolon: "Görsel 7"
            alan: gorsel_7
          - kolon: "Görsel 8"
            alan: gorsel_8
        kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/146
        tarih: "2026-10-27"
        guven: tahmin
        not: "Tam sütun başlıkları yalnız panelden indirilen kategori şablonunda görünür (Ürün > Toplu Ürün Yükleme; kırmızı başlıklar zorunlu, yeşil zeminli başlıklar özellik). Bu adlar zorunlu alan listesinden (birfatura) türetildi. Görseller şablonda bağlantı (URL) ister; tabloda dosya adı var, yükleyip bağlantıyı yapıştır."

  hepsiburada:
    ad: "Hepsiburada"
    kurallar:
      baslik_max:
        deger: 150
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Kaynaklar çelişiyor: birfatura (08.12.2025) 255, eticarethub ve sentos 150, bazıları kategoriye göre 150-255 diyor. Daha sıkı olan 150 kodlandı. Resmi sayfa (Akademi, geliştirici portalı) giriş istiyor ya da 403."
      baslik_kalip:
        deger: [marka, model, cinsiyet, temel_ozellikler, urun_tipi, renk, miktar]
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Marka + ürün + temel özellik genel önerisi; sıra bizim Türkçe kalıbımız."
      not_baslik_icerik:
        deger: "Başlıkta aşırı büyük harf, emoji ve sembol olmaz; 'en uygun fiyat', 'kampanya', 'ücretsiz kargo' gibi ifadeler eklenemez."
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
      aciklama_html:
        deger: "evet"
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "'HTML desteklenir; fakat agresif biçimlendirmeler önerilmez.' Açıklama için en çok uzunluk bulunamadı."
      not_aciklama_icerik:
        deger: "Teknik özellik tablosu beklenir; yanıltıcı ya da tıbbi iddia olmaz."
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
      madde_alani:
        deger: "Ayrı madde alanı bulunamadı. Öne çıkan maddeler açıklamanın başına liste olarak eklenir."
        kaynak: https://github.com/ksmylmz/hepsiburada
        tarih: "2026-10-27"
        guven: ikincil
        not: "Üçüncü taraf API istemcisindeki alan listesinde madde alanı yok."
      madde_adet:
        deger: 5
        kaynak: "yok: bizim önerimiz (açıklamadaki liste için)"
        tarih: "2026-10-27"
        guven: tahmin
      arama_alani:
        deger: "Ayrı arama kelimesi alanı bulunamadı. Kelimeler başlıkta, açıklamada ve özelliklerde doğal biçimde geçmeli."
        kaynak: "yok: araştırmada alan bulunamadı (resmi sayfalar giriş istiyor)"
        tarih: "2026-10-27"
        guven: tahmin
      not_marka_barkod:
        deger: "Marka Hepsiburada'da onaylı olmalı. Çoğu kategoride barkod zorunlu; el yapımı ve kişiye özel ürünlerde istisna kategori yöneticisi onayı isteyebilir."
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Marka onayı ecosire (23.03.2026) kaynağında da geçiyor."
      gorsel_adet_max:
        deger: 10
        kaynak: https://developers.hepsiburada.com/hepsiburada/changelog/hepsiburada-entegrasyon-haziran-2025
        tarih: "2026-10-22"
        guven: resmi
        dogrula: evet
        not: "22.10.2026'da okundu, 27.10.2026'da 403. İkincil kaynaklar (ecosire, meayt) 8 diyor."
      gorsel_min_px:
        deger: "600x600"
        kaynak: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Çelişki: meayt (02.10.2026) en az 500x500, birfatura 600x600 diyor. Daha sıkı olan kodlandı."
      gorsel_onerilen_px:
        deger: "1500x1500"
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Önerilen 1500-2000 px, 1:1."
      gorsel_oran:
        deger: "1:1"
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
      gorsel_dosya_mb_max:
        deger: 10
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
      gorsel_dosya_turleri:
        deger: [JPEG, PNG]
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "birfatura yalnız JPG diyor."
      gorsel_zemin:
        deger: saf_beyaz
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
        not: "Ana görsel saf beyaz #FFFFFF."
      gorsel_doluluk_min:
        deger: 85
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
      gorsel_yazi:
        deger: "Ana görselde yazı, logo, rozet ve filigran olmaz"
        kaynak: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
        tarih: "2026-10-27"
        guven: ikincil
      csv_kolonlar:
        deger:
          - kolon: "Barcode"
            alan: barkod
          - kolon: "merchantSku"
            alan: stok_kodu
          - kolon: "VaryantGroupID"
            alan: model_kodu
          - kolon: "UrunAdi"
            alan: baslik
          - kolon: "UrunAciklamasi"
            alan: aciklama
          - kolon: "Marka"
            alan: marka
          - kolon: "GarantiSuresi"
            alan: "ozellik:Garanti Süresi"
          - kolon: "kg"
            alan: desi
          - kolon: "tax_vat_rate"
            alan: kdv
          - kolon: "renk_variant_property"
            alan: renk
          - kolon: "ebatlar_variant_property"
            alan: beden
          - kolon: "Image1"
            alan: gorsel_1
          - kolon: "Image2"
            alan: gorsel_2
          - kolon: "Image3"
            alan: gorsel_3
          - kolon: "Image4"
            alan: gorsel_4
          - kolon: "Image5"
            alan: gorsel_5
        kaynak: https://github.com/ksmylmz/hepsiburada
        tarih: "2026-10-27"
        guven: ikincil
        not: "Ürün oluşturma (katalog) alan adları; üçüncü taraf API istemcisinden. Panel Excel şablonunun başlıkları farklı olabilir. Fiyat ve stok bu listede yok: ürün kataloğa girdikten sonra ayrı listeleme adımında girilir (panelden doğrula). Aynı VaryantGroupID varyantları gruplar; 'kg' alanına desi değil ağırlık yazılmalı, doldurmadan önce kontrol et."

  n11:
    ad: "n11"
    kurallar:
      baslik_max:
        deger: 65
        kaynak: https://magazadestek.n11.com/sss/621
        tarih: "2026-10-27"
        guven: resmi
        dogrula: evet
