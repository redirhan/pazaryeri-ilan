    guven: ikincil
    not: "Amazon giyim kılavuzu (resmi), Hepsiburada (birfatura, ikincil) ve Trendyol Akademi (kampanya ifadesi, arama özeti) birleştirildi. Liste genişletilebilir: sonu $ = tam kelime, r: = düzenli ifade (işaretsiz küçük harfe çevrilmiş metinde)."
  yasak_iletisim_ifadeleri:
    deger: ["whatsapp", "telegram", "bize ulaşın", "bize ulasin", "iletişime geçin", "dm at", "dm atın", "dmden", "mesaj atın", "bizi arayın", "sitemizden", "web sitemiz", "instagram sayfamız", "profilimizdeki link"]
