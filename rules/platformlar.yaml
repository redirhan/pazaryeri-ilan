        guven: resmi
      madde_adet:
        deger: 5
        kaynak: "yok: bizim önerimiz (açıklamadaki liste için)"
        tarih: "2026-10-27"
        guven: tahmin
      arama_alani:
        deger: "Ayrı arama kelimesi alanı bulunamadı. Kelimeler başlıkta, alt başlıkta, açıklamada ve özelliklerde doğal biçimde geçmeli."
        kaynak: https://developer.n11.com/documentation/n11-marketplace-entegrasyonu/urun-yukleme/
        tarih: "2026-10-27"
        guven: resmi
      not_marka_barkod:
        deger: "Marka zorunlu (özellik olarak girilir). Barkod isteğe bağlı; yalnız ulusal barkodlar kaydedilir, aynı barkod tekrar reddedilir."
        kaynak: https://developer.n11.com/documentation/n11-marketplace-entegrasyonu/urun-yukleme/
        tarih: "2026-10-27"
        guven: resmi
