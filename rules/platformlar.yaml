    kaynak: "yok: bizim kontrol listemiz; zorunlu alanlar kategori şablonunda değişir"
    tarih: "2026-10-27"
    guven: tahmin
    not: "Trendyol açıklamada içerik, detay, garanti ve hammadde ister (Akademi detay/242, resmi, arama özeti)."
