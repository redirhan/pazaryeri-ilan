    not: "Trendyol görsellerinde başka e-ticaret sitesi adı yasak (resmi, arama özeti); metinler için de aynı uygulanır (genel uygulama)."
  belge_gerektiren_iddialar:
    deger: ["doğal$", "%100 doğal", "organik", "antibakteriyel", "antiseptik", "hipoalerjenik", "dermatolojik", "klinik olarak", "tedavi", "iyileştirir", "şifa", "kimyasal içermez", "katkısız", "vegan$", "glutensiz", "zayıflatır", "kanser"]
    kaynak: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    tarih: "2026-10-27"
    guven: tahmin
    not: "Trendyol görsellerinde sağlık beyanı yasak (resmi, arama özeti); Hepsiburada tıbbi iddia yasak (ikincil). Kelime listesi bizim; belgesi olan satıcı kullanabilir."
  ustunluk_iddialari:
    deger: ["en iyi", "en ucuz", "en kaliteli", "en çok satan", "1 numara", "bir numara", "türkiye'nin en", "piyasanın en", "rakipsiz", "lider marka", "eşsiz"]
    kaynak: https://www.resmigazete.gov.tr/eskiler/2015/01/20150110-5.htm
    tarih: "2026-10-27"
    guven: resmi
    not: "Ticari Reklam ve Haksız Ticari Uygulamalar Yönetmeliği md.9: iddialar ispatlanabilir olmalı. Reklam Etiketi Kontrolü KRS-03 ile aynı liste."
  indirim_ifadeleri:
    deger: ["indirim", "indirimli", "kampanya", "fırsat", "r:\\d+\\s?tl yerine", "yerine sadece", "stoklarla sınırlı", "son gün", "kaçırma", "üstü çizili", "r:%\\s?\\d+\\s?(indirim|off)", "r:(indirim|off)\\s?%\\s?\\d+"]
    kaynak: https://www.resmigazete.gov.tr/eskiler/2026/07/20260701-9.htm
