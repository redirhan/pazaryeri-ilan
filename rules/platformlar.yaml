    guven: resmi
    not: "RG 01.07.2026 / 33297 (yürürlük 01.08.2026), md.14: indirimden önceki fiyat = indirim başlangıcından önceki 10 günde uygulanan en düşük fiyat (14/3), yalnız aynı satış kanalı (14/5). Kelime listesi bizim."
