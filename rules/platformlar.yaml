ortak:
  yasak_baslik_ifadeleri:
    deger: ["indirim", "indirimli", "kampanya", "ücretsiz kargo", "kargo bedava", "bedava kargo", "aynı gün kargo", "hızlı kargo", "fırsat", "en uygun fiyat", "en ucuz", "en iyi", "en çok satan", "çok satan", "mükemmel ürün", "harika hediye", "son gün", "stoklarla sınırlı", "sınırlı stok", "orijinal ürün", "r:\\d+\\s?tl\\b"]
